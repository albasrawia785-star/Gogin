name: Build Debug Android APK (Final Robust Version)

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          sslVerify: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      # حل جذري لمشكلة "الملف غير موجود": محاولات تنزيل متعددة عبر الـ API
      - name: Robust Download and Unzip Project
        run: |
          ZIP_NAME="project_${{ github.event.client_payload.build_id }}.zip"
          echo "🔍 جاري البحث عن الملف: $ZIP_NAME"
          
          # الانتظار والمحاولة 10 مرات (إجمالي 30 ثانية) لضمان انتهاء الرفع من الموقع
          for i in {1..10}; do
            curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                 -H "Accept: application/vnd.github.v3.raw" \
                 -L "https://api.github.com/repos/${{ github.repository }}/contents/$ZIP_NAME" \
                 -o "$ZIP_NAME"
            
            if [ -f "$ZIP_NAME" ] && [ -s "$ZIP_NAME" ]; then
              echo "✅ تم الحصول على الملف بنجاح!"
              break
            fi
            echo "🔄 محاولة ($i/10): الملف لم يكتمل رفعه بعد، انتظار 3 ثوانٍ..."
            sleep 3
          done

          if [ ! -f "$ZIP_NAME" ]; then
            echo "❌ خطأ فادح: فشل تحميل الملف بعد محاولات عديدة."
            exit 1
          fi
          
          unzip -o "$ZIP_NAME" -d project_dir
          rm "$ZIP_NAME"

      # إصلاح تعارضات Gradle التلقائي
      - name: Smart Patch Gradle
        run: |
          cd project_dir
          find . -name "build.gradle*" -exec sed -i '/kotlinCompilerExtensionVersion/d' {} +
        continue-on-error: true

      # عملية البناء والتوقيع
      - name: Build and Sign
        env:
          _JAVA_OPTIONS: "-Xmx4g -Djava.awt.headless=true"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
        run: |
          # البحث الآمن عن مسار المشروع
          SETTINGS_FILE=$(find project_dir \( -name "settings.gradle.kts" -o -name "settings.gradle" -o -name "build.gradle" \) -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ خطأ: لم يتم العثور على ملفات أندرويد. تأكد من ضغط مجلد المشروع مباشرة!"
            ls -R project_dir
            exit 1
          fi
          
          cd "$(dirname "$SETTINGS_FILE")"
          
          [ ! -f "gradlew" ] && gradle wrapper
          chmod +x gradlew

          # توقيع تلقائي
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass "android" -keypass "android" -dname "CN=Android Debug, O=Android, C=US" || true

          # بناء
          ./gradlew clean assembleDebug --no-daemon

          # استخراج الناتج
          APK_FILE=$(find . -path "*/build/outputs/apk/debug/*.apk" -o -name "*debug*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ فشل البناء."
            exit 1
          fi
          cp "$APK_FILE" "$GITHUB_WORKSPACE/app-debug.apk"

      # رفع النتيجة
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.event.client_payload.build_id }}"
          name: "Debug APK ${{ github.event.client_payload.build_id }}"
          files: "app-debug.apk"
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # تنظيف نهائي
      - name: Cleanup
        if: always()
        run: |
          rm -rf project_dir
          rm -f "app-debug.apk"
