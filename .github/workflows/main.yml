name: Universal Android Debug APK Builder (With Fail-Safe Gradle)

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. سحب كود المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          sslVerify: false

      # 2. إعداد بيئة جافا (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      # 3. البحث عن ملف الـ ZIP وفك ضغطه
      - name: Robust Find and Unzip Project
        run: |
          BUILD_ID="${{ github.event.client_payload.build_id }}"
          echo "🔍 جاري البحث عن ملف المشروع برقم البناء: $BUILD_ID"
          
          ZIP_FILE=""
          for i in {1..10}; do
            ZIP_FILE=$(find . -maxdepth 1 -name "*${BUILD_ID}*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "✅ تم العثور على الملف: $ZIP_FILE"
              break
            fi
            echo "🔄 محاولة ($i/10): انتظار اكتمال رفع الملف..."
            sleep 3
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ خطأ: لم يتم العثور على الملف المطلوب برقم $BUILD_ID!"
            exit 1
          fi

          mkdir -p project_dir
          unzip -o "$ZIP_FILE" -d project_dir

      # 4. استبدال أيقونة المشروع تلقائياً (حذف XML وإجبار الصورة الجديد)
      - name: Replace App Icon (Forced Override)
        run: |
          BUILD_ID="${{ github.event.client_payload.build_id }}"
          ICON_FILE=$(find . -maxdepth 1 \( -name "*${BUILD_ID}*.png" -o -name "*${BUILD_ID}*.jpg" -o -name "*${BUILD_ID}*.jpeg" -o -name "*${BUILD_ID}*.webp" \) | head -n 1)

          if [ -n "$ICON_FILE" ]; then
            echo "🖼️ تم العثور على الأيقونة الجديدة: $ICON_FILE"

            find project_dir -type f \( -name "ic_launcher*.xml" -o -name "ic_launcher_round*.xml" \) -exec rm -f {} \;

            find project_dir -type f \( \
              -name "ic_launcher*.png" -o \
              -name "ic_launcher_round*.png" -o \
              -name "ic_launcher_foreground*.png" -o \
              -name "ic_launcher_background*.png" \
            \) -exec cp -f "$ICON_FILE" {} \;

            echo "✅ تم استبدال جميع الأيقونات بنجاح!"
          else
            echo "ℹ️ لم يتم العثور على أيقونة مرفوعة برقم $BUILD_ID، سيتم استخدام الأيقونة الأصلية."
          fi
        continue-on-error: true

      # 5. إصلاح تعارضات المكاتب والنسخ آلياً
      - name: Smart Patch Gradle Files
        run: |
          cd project_dir
          find . -name "build.gradle*" -exec sed -i '/kotlinCompilerExtensionVersion/d' {} +
        continue-on-error: true

      # 6. البناء المرن مع نظام حماية تنزيل Gradle من خطأ 503
      - name: Build Debug APK (With Gradle 503 Fallback)
        env:
          _JAVA_OPTIONS: "-Xmx4g -Djava.awt.headless=true"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
        run: |
          SETTINGS_FILE=$(find project_dir -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find project_dir -name "build.gradle.kts" -o -name "build.gradle" | head -n 1)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ خطأ: لم يتم العثور على مشروع أندرويد صالح داخل الملف المضغوط!"
            exit 1
          fi

          ROOT_DIR=$(dirname "$SETTINGS_FILE")
          echo "📂 جذر المشروع المحدد: $ROOT_DIR"
          cd "$ROOT_DIR"

          # 🔧 فحص سلامة رابط Gradle واستبداله في حال وجود خطأ 503/404
          WRAPPER_PROP=$(find . -name "gradle-wrapper.properties" | head -n 1)
          if [ -n "$WRAPPER_PROP" ]; then
            echo "🔧 فحص رابط Gradle في gradle-wrapper.properties..."
            sed -i 's|http\\://|https\\://|g' "$WRAPPER_PROP"
            
            # استخراج الرابط المستهدف
            TARGET_URL=$(grep "distributionUrl" "$WRAPPER_PROP" | cut -d'=' -f2 | tr -d '\r' | sed 's/\\:/:/g')
            echo "🔗 الرابط الحالي: $TARGET_URL"
            
            # اختبار سلامة الرابط بحجم الرأس فقط (HTTP status)
            HTTP_STATUS=$(curl -s -o /dev/null -I -w "%{http_code}" "$TARGET_URL" || echo "000")
            echo "📡 حالة السيرفر للرابط: $HTTP_STATUS"
            
            if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 302 ]; then
              echo "⚠️ الرابط الحالي معطل أو أرجع خطأ $HTTP_STATUS! جاري التحويل تلقائياً لنسخة مستقرة ومعتمدة (Gradle 8.10.2)..."
              sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.10.2-bin.zip|g' "$WRAPPER_PROP"
            fi
          fi

          # تجهيز أذونات التنفيذ للـ Wrapper
          if [ -f "gradlew" ]; then
            echo "✅ استخدام Gradle Wrapper..."
            chmod +x gradlew
          else
            echo "⚠️ لم يتم العثور على gradlew، جاري إنشاؤه آلياً..."
            gradle wrapper --gradle-version 8.10.2
            chmod +x gradlew
          fi

          # توليد keystore للتوقيع
          keytool -genkey -v -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "android" \
            -keypass "android" \
            -dname "CN=Android Debug, O=Android, C=US" || true

          echo "🚀 بدء عملية البناء..."
          ./gradlew clean assembleDebug --no-daemon

          # البحث عن ملف الـ APK الناتج
          APK_FILE=$(find . -path "*/build/outputs/apk/debug/*.apk" -o -name "*debug*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "❌ فشل العثور على ملف الـ APK الناتج!"
            exit 1
          fi

          echo "🔑 استخراج بصمة SHA-1..."
          ./gradlew signingReport --no-daemon | grep -E "Variant: debug|SHA1:" || true

          # نسخ ملف الـ APK للمسار الرئيسي
          cp "$APK_FILE" "$GITHUB_WORKSPACE/app-debug-${{ github.event.client_payload.build_id }}.apk"

      # 7. نشر الـ APK كـ Release ليتم تنزيله آلياً
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.event.client_payload.build_id }}"
          name: "Debug APK Build ${{ github.event.client_payload.build_id }}"
          files: "app-debug-${{ github.event.client_payload.build_id }}.apk"
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 8. التنظيف الآلي الشامل للمستودع
      - name: Auto Cleanup
        if: always()
        run: |
          git config --global http.sslVerify false
          git config --global user.name "Auto Bot"
          git config --global user.email "bot@github.com"
          
          rm -rf project_dir || true
          rm -f "app-debug-${{ github.event.client_payload.build_id }}.apk" || true
          
          find . -maxdepth 1 -name "*.zip" -exec rm -f {} +
          find . -maxdepth 1 -name "*.png" -exec rm -f {} +
          find . -maxdepth 1 -name "*.jpg" -exec rm -f {} +
          find . -maxdepth 1 -name "*.jpeg" -exec rm -f {} +
          find . -maxdepth 1 -name "*.webp" -exec rm -f {} +
          
          git add . || true
          git commit -m "Auto cleanup for build ${{ github.event.client_payload.build_id }}" || true
          git pull origin main --rebase || true
          git push origin main || true
