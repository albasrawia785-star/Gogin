name: Universal Dual Android Builder (Fixed Compose Compiler Error)

on:
  repository_dispatch:
    types: [build_apk, build_aab, build_app]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. سحب كود المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          sslVerify: false

      # 2. إعداد بيئة جافا (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      # 3. البحث عن ملف الـ ZIP وفك ضغطه
      - name: Robust Find and Unzip Project
        run: |
          BUILD_ID="${{ github.event.client_payload.build_id }}"
          echo "🔍 جاري البحث عن ملف المشروع برقم البناء: $BUILD_ID"
          
          ZIP_FILE=""
          for i in {1..10}; do
            ZIP_FILE=$(find . -maxdepth 1 -name "*${BUILD_ID}*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "✅ تم العثور على الملف: $ZIP_FILE"
              break
            fi
            echo "🔄 محاولة ($i/10): انتظار اكتمال رفع الملف..."
            sleep 3
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ خطأ: لم يتم العثور على الملف المطلوب برقم $BUILD_ID!"
            exit 1
          fi

          mkdir -p project_dir
          unzip -o "$ZIP_FILE" -d project_dir

      # 4. استبدال الأيقونة وتصفية التكرارات
      - name: Smart App Icon Overrider (Fix Duplicate Resources)
        run: |
          BUILD_ID="${{ github.event.client_payload.build_id }}"
          
          ICON_FILE=""
          for i in {1..5}; do
            ICON_FILE=$(find . -maxdepth 1 \( -name "*${BUILD_ID}*.png" -o -name "*${BUILD_ID}*.jpg" -o -name "*${BUILD_ID}*.jpeg" -o -name "*${BUILD_ID}*.webp" -o -name "icon_*.png" \) ! -name "app-debug*" | head -n 1)
            if [ -n "$ICON_FILE" ]; then
              echo "🖼️ تم العثور على الأيقونة المرفوعة: $ICON_FILE"
              break
            fi
            sleep 2
          done

          if [ -n "$ICON_FILE" ]; then
            echo "🚀 تنظيف كافة الأيقونات القديمة (PNG / WEBP / XML) لتفادي خطأ Duplicate Resources..."

            find project_dir -type d -name "mipmap-anydpi*" -exec rm -rf {} +
            find project_dir -type d -name "drawable-anydpi*" -exec rm -rf {} +

            find project_dir -type f \( \
              -name "ic_launcher*" -o \
              -name "ic_launcher_round*" -o \
              -name "ic_launcher_foreground*" -o \
              -name "ic_launcher_background*" \
            \) -exec rm -f {} \;

            find project_dir -type d -name "mipmap*" | while read -r dir; do
              cp -f "$ICON_FILE" "$dir/ic_launcher.png"
              cp -f "$ICON_FILE" "$dir/ic_launcher_round.png"
            done

            echo "✅ تم حذف الموارد المكررة وزرع الأيقونة الجديدة بنجاح!"
          else
            echo "⚠️ لم يتم العثور على صورة الأيقونة، سيتم استخدام أيقونة المشروع الأصلية."
          fi
        continue-on-error: true

      # 5. إصلاح وتطهير شامل لتعارضات Compose و Kotlin
      - name: Smart Patch Gradle & Compose Compatibility
        run: |
          cd project_dir
          echo "🔧 معالجة وتطهير شامل لملفات Gradle من إعدادات Compose Compiler القديمة..."
          
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i '/kotlinCompilerExtensionVersion/d' {} +
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i '/suppressKotlinVersionCompatibilityCheck/d' {} +
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i '/id.*org.jetbrains.kotlin.plugin.compose/d' {} +
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i '/id.*androidx.compose.compiler/d' {} +
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i '/alias.*compose.compiler/d' {} +

          echo "android.suppressUnsupportedCompileSdk=true" >> gradle.properties
          echo "kotlin.mpp.stability.nowarn=true" >> gradle.properties
        continue-on-error: true

      # 6. البناء والتجميع بـ Gradle المباشر مع توفير المفاتيح
      - name: Dual Build Engine (APK & AAB with Universal Keystore Fix)
        env:
          _JAVA_OPTIONS: "-Xmx4g -Djava.awt.headless=true"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
        run: |
          SETTINGS_FILE=$(find project_dir -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find project_dir -name "build.gradle.kts" -o -name "build.gradle" | head -n 1)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ خطأ: لم يتم العثور على مشروع أندرويد صالح داخل الملف المضغوط!"
            exit 1
          fi

          ROOT_DIR=$(dirname "$SETTINGS_FILE")
          echo "📂 جذر المشروع المحدد: $ROOT_DIR"
          cd "$ROOT_DIR"

          # 🔑 إنشاء ملفات التوقيع الشاملة
          keytool -genkey -v -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "android" \
            -keypass "android" \
            -dname "CN=Android Debug, O=Android, C=US" || true

          keytool -genkey -v -keystore release.keystore \
            -alias androidreleasekey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "android" \
            -keypass "android" \
            -dname "CN=Android Release, O=Android, C=US" || true

          if [ -d "app" ]; then
            cp -f debug.keystore app/debug.keystore || true
            cp -f release.keystore app/release.keystore || true
          fi

          # ⚙️ تحديد نوع البناء (aab أو apk)
          BUILD_TYPE="${{ github.event.client_payload.build_type }}"
          BUILD_ID="${{ github.event.client_payload.build_id }}"

          if [ "$BUILD_TYPE" == "aab" ]; then
            echo "🚀 بدء بناء حزمة المتجر الرسمية (App Bundle - .aab)..."
            gradle clean bundleRelease --no-daemon || gradle clean bundleDebug --no-daemon

            OUT_FILE=$(find . -path "*/build/outputs/bundle/*/*.aab" | head -n 1)
            FINAL_NAME="app-release-${BUILD_ID}.aab"
          else
            echo "🚀 بدء بناء حزمة التجربة المباشرة (Debug APK - .apk)..."
            gradle clean assembleDebug --no-daemon

            OUT_FILE=$(find . -path "*/build/outputs/apk/debug/*.apk" -o -name "*debug*.apk" | head -n 1)
            FINAL_NAME="app-debug-${BUILD_ID}.apk"
          fi

          if [ -z "$OUT_FILE" ]; then
            echo "❌ فشل العثور على الملف الناتج للمشروع!"
            exit 1
          fi

          echo "✅ تم إنشاؤه بنجاح: $OUT_FILE"
          cp "$OUT_FILE" "$GITHUB_WORKSPACE/$FINAL_NAME"

      # 7. نشر الناتج كـ Release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.event.client_payload.build_id }}"
          name: "Build ${{ github.event.client_payload.build_id }}"
          files: "app-*-${{ github.event.client_payload.build_id }}.*"
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 8. التنظيف الآلي الشامل للمستودع
      - name: Auto Cleanup
        if: always()
        run: |
          git config --global http.sslVerify false
          git config --global user.name "Auto Bot"
          git config --global user.email "bot@github.com"
          
          rm -rf project_dir || true
          rm -f app-*-${{ github.event.client_payload.build_id }}.* || true
          
          find . -maxdepth 1 -name "*.zip" -exec rm -f {} +
          find . -maxdepth 1 -name "*.png" -exec rm -f {} +
          find . -maxdepth 1 -name "*.jpg" -exec rm -f {} +
          find . -maxdepth 1 -name "*.jpeg" -exec rm -f {} +
          find . -maxdepth 1 -name "*.webp" -exec rm -f {} +
          
          git add . || true
          git commit -m "Auto cleanup for build ${{ github.event.client_payload.build_id }}" || true
          git pull origin main --rebase || true
          git push origin main || true
