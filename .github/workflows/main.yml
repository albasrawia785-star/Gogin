name: Universal Android Debug APK Builder (Complete Production Version)

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. سحب كود المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          sslVerify: false

      # 2. إعداد بيئة جافا (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      # 3. البحث عن ملف الـ ZIP وفك ضغطه
      - name: Robust Find and Unzip Project
        run: |
          BUILD_ID="${{ github.event.client_payload.build_id }}"
          echo "🔍 جاري البحث عن ملف المشروع برقم البناء: $BUILD_ID"
          
          ZIP_FILE=""
          for i in {1..10}; do
            ZIP_FILE=$(find . -maxdepth 1 -name "*${BUILD_ID}*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "✅ تم العثور على الملف: $ZIP_FILE"
              break
            fi
            echo "🔄 محاولة ($i/10): انتظار اكتمال رفع الملف..."
            sleep 3
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ خطأ: لم يتم العثور على الملف المطلوب برقم $BUILD_ID!"
            exit 1
          fi

          mkdir -p project_dir
          unzip -o "$ZIP_FILE" -d project_dir

      # 4. استبدال أيقونة المشروع الشامل والتلقائي (نسخة معالجة الأيقونات التكيفية الشاملة)
      - name: Smart App Icon Overrider
        run: |
          BUILD_ID="${{ github.event.client_payload.build_id }}"
          
          # 1. انتظار وتأكيد وجود صورة الأيقونة في جذر المستودع
          ICON_FILE=""
          for i in {1..5}; do
            ICON_FILE=$(find . -maxdepth 1 \( -name "*${BUILD_ID}*.png" -o -name "*${BUILD_ID}*.jpg" -o -name "*${BUILD_ID}*.jpeg" -o -name "*${BUILD_ID}*.webp" -o -name "icon_*.png" \) ! -name "app-debug*" | head -n 1)
            if [ -n "$ICON_FILE" ]; then
              echo "🖼️ تم العثور على الأيقونة المرفوعة: $ICON_FILE"
              break
            fi
            sleep 2
          done

          if [ -n "$ICON_FILE" ]; then
            echo "🚀 بدء إزالة الأيقونات التكيفية واختراق نظام الـ XML..."

            # 2. حذف كل مجلدات mipmap-anydpi لضمان عدم قراءة الأيقونات التكيفية (Adaptive Vectors / XML)
            find project_dir -type d -name "mipmap-anydpi*" -exec rm -rf {} +
            find project_dir -type d -name "drawable-anydpi*" -exec rm -rf {} +
            
            # 3. حذف كافة ملفات XML الخاصة بالأيقونات في أي مجلد داخل المشروع
            find project_dir -type f \( -name "ic_launcher*.xml" -o -name "ic_launcher_round*.xml" \) -exec rm -f {} \;

            # 4. استبدال جميع صور الـ PNG القديمة للأيقونات داخل كافة مجلدات mipmap و drawable
            find project_dir -type f \( \
              -name "ic_launcher*.png" -o \
              -name "ic_launcher_round*.png" -o \
              -name "ic_launcher_foreground*.png" -o \
              -name "ic_launcher_background*.png" \
            \) -exec cp -f "$ICON_FILE" {} \;

            # 5. زرع الصورة الجديدة كـ ic_launcher.png و ic_launcher_round.png في كل مجلدات mipmap لتغطية المقاسات
            find project_dir -type d -name "mipmap*" | while read -r dir; do
              cp -f "$ICON_FILE" "$dir/ic_launcher.png"
              cp -f "$ICON_FILE" "$dir/ic_launcher_round.png"
            done

            echo "✅ تم استبدال الأيقونة بنجاح، وحذف المجلدات والملفات التكيفية التعارضية!"
          else
            echo "⚠️ لم يتم العثور على صورة الأيقونة، سيتم استخدام أيقونة المشروع الأصلية."
          fi
        continue-on-error: true

      # 5. إصلاح تعارضات المكاتب والنسخ آلياً
      - name: Smart Patch Gradle Files
        run: |
          cd project_dir
          find . -name "build.gradle*" -exec sed -i '/kotlinCompilerExtensionVersion/d' {} +
        continue-on-error: true

      # 6. البناء والتجميع بـ Gradle المباشر
      - name: Build Debug APK (Direct Gradle Runner)
        env:
          _JAVA_OPTIONS: "-Xmx4g -Djava.awt.headless=true"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
        run: |
          SETTINGS_FILE=$(find project_dir -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find project_dir -name "build.gradle.kts" -o -name "build.gradle" | head -n 1)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ خطأ: لم يتم العثور على مشروع أندرويد صالح داخل الملف المضغوط!"
            exit 1
          fi

          ROOT_DIR=$(dirname "$SETTINGS_FILE")
          echo "📂 جذر المشروع المحدد: $ROOT_DIR"
          cd "$ROOT_DIR"

          # توليد keystore للتوقيع الـ Debug
          keytool -genkey -v -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "android" \
            -keypass "android" \
            -dname "CN=Android Debug, O=Android, C=US" || true

          echo "🚀 بدء عملية البناء واستخراج الـ Debug APK..."
          gradle clean assembleDebug --no-daemon

          # البحث عن ملف الـ APK الناتج
          APK_FILE=$(find . -path "*/build/outputs/apk/debug/*.apk" -o -name "*debug*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "❌ فشل العثور على ملف الـ APK الناتج!"
            exit 1
          fi

          echo "🔑 استخراج بصمة SHA-1..."
          gradle signingReport --no-daemon | grep -E "Variant: debug|SHA1:" || true

          # نسخ ملف الـ APK للمسار الرئيسي
          cp "$APK_FILE" "$GITHUB_WORKSPACE/app-debug-${{ github.event.client_payload.build_id }}.apk"

      # 7. نشر الـ APK كـ Release ليتم تنزيله آلياً
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.event.client_payload.build_id }}"
          name: "Debug APK Build ${{ github.event.client_payload.build_id }}"
          files: "app-debug-${{ github.event.client_payload.build_id }}.apk"
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 8. التنظيف الآلي الشامل للمستودع
      - name: Auto Cleanup
        if: always()
        run: |
          git config --global http.sslVerify false
          git config --global user.name "Auto Bot"
          git config --global user.email "bot@github.com"
          
          rm -rf project_dir || true
          rm -f "app-debug-${{ github.event.client_payload.build_id }}.apk" || true
          
          find . -maxdepth 1 -name "*.zip" -exec rm -f {} +
          find . -maxdepth 1 -name "*.png" -exec rm -f {} +
          find . -maxdepth 1 -name "*.jpg" -exec rm -f {} +
          find . -maxdepth 1 -name "*.jpeg" -exec rm -f {} +
          find . -maxdepth 1 -name "*.webp" -exec rm -f {} +
          
          git add . || true
          git commit -m "Auto cleanup for build ${{ github.event.client_payload.build_id }}" || true
          git pull origin main --rebase || true
          git push origin main || true
