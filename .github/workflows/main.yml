name: Build Debug Android APK with Firebase

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. سحب الكود الرئيسي للمستودع
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          sslVerify: false

      # 2. إعداد بيئة جافا (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      # 3. فك ضغط ملف المشروع المرفوع بحسب رقم البناء بأي اسم كان
      - name: Robust Find and Unzip Project
        run: |
          BUILD_ID="${{ github.event.client_payload.build_id }}"
          echo "🔍 جاري البحث عن أي ملف يحتوي على رقم البناء: $BUILD_ID"
          
          # الانتظار والمحاولة حتى 5 مرات للتأكد من اكتمال الرفع من الموقع
          for i in {1..5}; do
            ZIP_FILE=$(find . -maxdepth 1 -name "*${BUILD_ID}*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "✅ تم العثور على الملف: $ZIP_FILE"
              break
            fi
            echo "🔄 محاولة ($i/5): انتظار الرفع..."
            sleep 3
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ خطأ: لم يتم العثور على أي ملف zip يطابق رقم البناء $BUILD_ID"
            ls -la
            exit 1
          fi

          # حفظ الاسم الفعلي للملف لاستخدامه في خطوة الحذف لاحقاً
          echo "TARGET_ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV
          
          unzip -o "$ZIP_FILE" -d project_dir

      # 4. إصلاح تلقائي لمنع تعارضات Compose Compiler و Kotlin
      - name: Smart Patch Gradle Files
        run: |
          cd project_dir
          find . -name "build.gradle*" -exec sed -i '/kotlinCompilerExtensionVersion/d' {} +
        continue-on-error: true

      # 5. تحديد المسار والبناء والتوقيع
      - name: Build Debug APK & Extract SHA-1
        env:
          _JAVA_OPTIONS: "-Xmx4g -Djava.awt.headless=true"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
        run: |
          SETTINGS_FILE=$(find project_dir \( -name "settings.gradle.kts" -o -name "settings.gradle" -o -name "build.gradle.kts" -o -name "build.gradle" \) -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ خطأ: لم يتم العثور على أي ملفات بناء لأندرويد داخل الملف المضغوط!"
            exit 1
          fi

          TARGET_DIR=$(dirname "$SETTINGS_FILE")
          cd "$TARGET_DIR"

          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

          keytool -genkey -v -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "android" \
            -keypass "android" \
            -dname "CN=Android Debug, O=Android, C=US" || true

          ./gradlew clean assembleDebug --no-daemon

          ./gradlew signingReport --no-daemon | grep -E "Variant: debug|SHA1:" || true

          APK_FILE=$(find . -path "*/build/outputs/apk/debug/*.apk" -o -name "*debug*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "❌ فشل العثور على ملف الـ APK الناتج!"
            exit 1
          fi

          cp "$APK_FILE" "$GITHUB_WORKSPACE/app-debug-${{ github.event.client_payload.build_id }}.apk"

      # 6. نشر الـ APK كـ Release
      - name: Create Release for Debug APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.event.client_payload.build_id }}"
          name: "Debug APK Build ${{ github.event.client_payload.build_id }}"
          files: "app-debug-${{ github.event.client_payload.build_id }}.apk"
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 7. التنظيف الآلي والآمن لجميع الملفات المضغوطة وحذفها من المستودع
      - name: Cleanup Repository
        if: always()
        run: |
          git config --global http.sslVerify false
          git config --global user.name "Auto Bot"
          git config --global user.email "bot@github.com"
          
          # حذف مجلد البناء وملف ה- APK المؤقت
          rm -rf project_dir || true
          rm -f "app-debug-${{ github.event.client_payload.build_id }}.apk" || true
          
          # حذف كل ملفات الـ zip التي تحتوي على أرقام البناء لعدم تراكمها
          find . -maxdepth 1 -name "*.zip" -exec rm -f {} +
          
          # عمل Commit للتنظيف ورفعه لـ GitHub فوراً
          git add . || true
          git commit -m "Auto cleanup zip files for build ${{ github.event.client_payload.build_id }}" || true
          git pull origin main --rebase || true
          git push origin main || true
