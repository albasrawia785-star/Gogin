name: Build Debug Android APK

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. سحب الكود الرئيسي للمستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      # 3. فك ضغط ملف المشروع الخاص بالمستخدم وحذفه
      - name: Unzip Project
        run: |
          ZIP_NAME="project_${{ github.event.client_payload.build_id }}.zip"
          if [ ! -f "$ZIP_NAME" ]; then
            echo "❌ الملف غير موجود!"
            exit 1
          fi
          unzip "$ZIP_NAME" -d project_dir
          rm "$ZIP_NAME"

      # 4. بناء الـ Debug APK مع معالجة حزمة Compose و Kotlin
      - name: Build Debug APK
        env:
          _JAVA_OPTIONS: "-Djava.awt.headless=true"
          GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.jvmargs=-Djava.awt.headless=true"
        run: |
          # البحث عن المسار الرئيسي للمشروع (settings.gradle)
          TARGET_DIR=$(find project_dir -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs dirname)
          if [ -z "$TARGET_DIR" ]; then
            echo "❌ لم يتم العثور على ملفات مشروع أندرويد!"
            exit 1
          fi
          cd "$TARGET_DIR"
          
          # إعداد Gradle وإعطاء تصاريح التشغيل
          gradle wrapper
          chmod +x gradlew

          # إنتاج مفتاح debug افتراضي لضمان توقيع النسخة
          keytool -genkey -v -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "android" \
            -keypass "android" \
            -dname "CN=Android Debug, O=Android, C=US" || true

          echo "🚀 بدء تنظيف وبناء نسخة الـ Debug..."
          ./gradlew clean assembleDebug --no-daemon --stacktrace

          # العثور الدقيق على ملف الـ APK الناتج داخل مجلدات البناء
          APK_FILE=$(find . -path "*/build/outputs/apk/debug/*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*debug*.apk" | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_FILE" ]; then
            echo "❌ فشل العثور على ملف الـ APK الناتج!"
            exit 1
          fi

          # نسخ الملف إلى المسار الرئيسي للتخزين المباشر
          cp "$APK_FILE" "$GITHUB_WORKSPACE/app-debug-${{ github.event.client_payload.build_id }}.apk"

      # 5. نشر الملف كـ Release مباشر معزول بالـ build_id
      - name: Create Release and Upload Debug APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.event.client_payload.build_id }}"
          name: "Debug APK Build ${{ github.event.client_payload.build_id }}"
          files: "app-debug-${{ github.event.client_payload.build_id }}.apk"
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 6. التنظيف الآلي والآمن لعدم تداخل الطلبات المتزامنة
      - name: Cleanup Repository
        if: always()
        run: |
          git config --global user.name "Auto Bot"
          git config --global user.email "bot@github.com"
          
          rm -rf project_dir || true
          rm -f "project_${{ github.event.client_payload.build_id }}.zip" || true
          rm -f "app-debug-${{ github.event.client_payload.build_id }}.apk" || true
          
          git add . || true
          git commit -m "Auto cleanup build ${{ github.event.client_payload.build_id }}" || true
          git pull origin main --rebase || true
          git push origin main || true
