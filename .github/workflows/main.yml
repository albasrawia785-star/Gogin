name: Build Debug Android APK (Final Fixed Version)

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. سحب الكود الرئيسي للمستودع
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          sslVerify: false

      # 2. إعداد بيئة جافا (JDK 17) باستخدام v5 وبدون cache لتفادي خطأ البحث عن الملفات
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      # 3. البحث المرن عن ملف الـ ZIP وفك ضغطه بحسب رقم البناء
      - name: Robust Find and Unzip Project
        run: |
          BUILD_ID="${{ github.event.client_payload.build_id }}"
          echo "🔍 البحث عن ملف المشروع برقم البناء: $BUILD_ID"
          
          ZIP_FILE=""
          for i in {1..10}; do
            ZIP_FILE=$(find . -maxdepth 1 -name "*${BUILD_ID}*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "✅ تم العثور على الملف: $ZIP_FILE"
              break
            fi
            echo "🔄 محاولة ($i/10): انتظار اكتمال رفع الملف..."
            sleep 3
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ خطأ: لم يتم العثور على الملف المطلوب برقم $BUILD_ID!"
            ls -la
            exit 1
          fi

          mkdir -p project_dir
          unzip -o "$ZIP_FILE" -d project_dir

      # 4. إصلاح تعارضات المكاتب تلقائياً (Patching)
      - name: Smart Patch Gradle Files
        run: |
          cd project_dir
          find . -name "build.gradle*" -exec sed -i '/kotlinCompilerExtensionVersion/d' {} +
        continue-on-error: true

      # 5. تحديد الجذر الرئيسي (Root Directory) والتجميع والتوقيع
      - name: Build Debug APK & Extract SHA-1
        env:
          _JAVA_OPTIONS: "-Xmx4g -Djava.awt.headless=true"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
        run: |
          SETTINGS_FILE=$(find project_dir -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "⚠️ لم يتم العثور على settings.gradle، جاري البحث عن build.gradle في الجذر..."
            SETTINGS_FILE=$(find project_dir -name "build.gradle.kts" -o -name "build.gradle" | head -n 1)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ خطأ: لم يتم العثور على مشروع أندرويد صالح داخل الملف المضغوط!"
            exit 1
          fi

          ROOT_DIR=$(dirname "$SETTINGS_FILE")
          echo "📂 جذر المشروع المحدد: $ROOT_DIR"
          cd "$ROOT_DIR"

          echo "🛠️ 1. تجهيز الـ Gradle Wrapper في الجذر..."
          if [ ! -f "gradlew" ]; then
            echo "⚠️ ملف gradlew غير موجود في الجذر، جاري إنشاؤه آلياً..."
            gradle wrapper
          fi
          chmod +x gradlew

          echo "🔑 2. توليد keystore للتوقيع الرسمي الموحد..."
          keytool -genkey -v -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "android" \
            -keypass "android" \
            -dname "CN=Android Debug, O=Android, C=US" || true

          echo "🔍 3. التحقق من وجود google-services.json لـ Firebase..."
          if [ ! -f "app/google-services.json" ]; then
            echo "⚠️ تنبيه: ملف google-services.json غير موجود داخل app/."
          fi

          echo "🚀 4. تنفيذ التجميع وبناء الـ Debug APK..."
          ./gradlew clean assembleDebug --no-daemon

          echo "🔑 5. استخراج بصمة SHA-1..."
          ./gradlew signingReport --no-daemon | grep -E "Variant: debug|SHA1:" || true

          APK_FILE=$(find . -path "*/build/outputs/apk/debug/*.apk" -o -name "*debug*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "❌ فشل العثور على ملف الـ APK الناتج!"
            exit 1
          fi

          cp "$APK_FILE" "$GITHUB_WORKSPACE/app-debug-${{ github.event.client_payload.build_id }}.apk"

      # 6. نشر الـ APK كـ Release ليتمكن موقعك من توجيه التنزيل آلياً
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.event.client_payload.build_id }}"
          name: "Debug APK Build ${{ github.event.client_payload.build_id }}"
          files: "app-debug-${{ github.event.client_payload.build_id }}.apk"
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 7. التنظيف الآلي الكامل لمستودع GitHub ومنع التراكم
      - name: Auto Cleanup
        if: always()
        run: |
          git config --global http.sslVerify false
          git config --global user.name "Auto Bot"
          git config --global user.email "bot@github.com"
          
          rm -rf project_dir || true
          rm -f "app-debug-${{ github.event.client_payload.build_id }}.apk" || true
          
          find . -maxdepth 1 -name "*.zip" -exec rm -f {} +
          
          git add . || true
          git commit -m "Auto cleanup for build ${{ github.event.client_payload.build_id }}" || true
          git pull origin main --rebase || true
          git push origin main || true
