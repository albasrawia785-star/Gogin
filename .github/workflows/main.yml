name: Build Debug Android APK with Direct Release

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. سحب الكود
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      # 3. فك ضغط ملف المشروع الفريد
      - name: Unzip project files
        run: |
          ZIP_NAME="project_${{ github.event.client_payload.build_id }}.zip"
          unzip "$ZIP_NAME" -d project_dir
          rm "$ZIP_NAME"

      # 4. بناء الـ Debug APK
      - name: Build Debug APK
        env:
          _JAVA_OPTIONS: "-Djava.awt.headless=true"
          GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.jvmargs=-Djava.awt.headless=true"
        run: |
          TARGET_DIR=$(find project_dir -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs dirname)
          if [ -z "$TARGET_DIR" ]; then
            echo "❌ لم يتم العثور على ملفات المشروع"
            exit 1
          fi
          cd "$TARGET_DIR"
          
          gradle wrapper
          chmod +x gradlew

          keytool -genkey -v -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "android" \
            -keypass "android" \
            -dname "CN=Android Debug, O=Android, C=US"

          ./gradlew assembleDebug --no-daemon

          # تجهيز الملف بنسخه وتسميته
          APK_FILE=$(find . -name "*.apk" | head -n 1)
          cp "$APK_FILE" "$GITHUB_WORKSPACE/app-debug-${{ github.event.client_payload.build_id }}.apk"

      # 5. رفع الـ APK كـ Release مباشر قابل للتحميل
      - name: Create Direct Download Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "build-${{ github.event.client_payload.build_id }}"
          name: "APK Build ${{ github.event.client_payload.build_id }}"
          files: "app-debug-${{ github.event.client_payload.build_id }}.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 6. التنظيف الآلي للمستودع
      - name: Cleanup Repository
        if: always()
        run: |
          git config --global user.name "Auto Bot"
          git config --global user.email "bot@github.com"
          git rm -rf project_dir || true
          git rm -f "project_${{ github.event.client_payload.build_id }}.zip" || true
          git commit -m "Auto cleanup build ${{ github.event.client_payload.build_id }}" || true
          git push || true
