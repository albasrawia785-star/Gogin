name: Universal Dual Android Builder

on:
  repository_dispatch:
    types: [build_apk, build_aab, build_app, build]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. سحب كود المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          sslVerify: false

      # 2. إعداد بيئة جافا (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      # 3. البحث الشامل عن ملف الـ ZIP في الجذر أو مجلد uploads وفك ضغطه
      - name: Find and Unzip Project
        run: |
          BUILD_ID="${{ github.event.client_payload.build_id }}"
          echo "🔍 جاري البحث عن ملف المشروع برقم البناء: $BUILD_ID"
          
          ZIP_FILE=""
          for i in {1..10}; do
            ZIP_FILE=$(find . -name "*${BUILD_ID}*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "✅ تم العثور على الملف: $ZIP_FILE"
              break
            fi
            echo "🔄 محاولة ($i/10): انتظار اكتمال رفع الملف..."
            sleep 3
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ خطأ: لم يتم العثور على الملف المطلوب برقم $BUILD_ID!"
            exit 1
          fi

          mkdir -p project_dir
          unzip -o "$ZIP_FILE" -d project_dir

      # 4. إصلاح وتطهير إعدادات Compose Compiler و Gradle
      - name: Patch Gradle & Compose Compatibility
        run: |
          cd project_dir
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i '/kotlinCompilerExtensionVersion/d' {} +
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i '/suppressKotlinVersionCompatibilityCheck/d' {} +
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i '/id.*org.jetbrains.kotlin.plugin.compose/d' {} +
          echo "android.suppressUnsupportedCompileSdk=true" >> gradle.properties
        continue-on-error: true

      # 5. تنفيذ البناء والتجميع (APK / AAB)
      - name: Execute Gradle Build
        env:
          _JAVA_OPTIONS: "-Xmx4g -Djava.awt.headless=true"
        run: |
          SETTINGS_FILE=$(find project_dir -name "settings.gradle.kts" -o -name "settings.gradle" -o -name "build.gradle" | head -n 1)
          ROOT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$ROOT_DIR"

          # إنشاء مفاتيح التوقيع المؤقتة
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass "android" -keypass "android" -dname "CN=Android Debug, O=Android, C=US" || true
          if [ -d "app" ]; then cp -f debug.keystore app/debug.keystore || true; fi

          BUILD_TYPE="${{ github.event.client_payload.build_type }}"
          BUILD_ID="${{ github.event.client_payload.build_id }}"

          if [ "$BUILD_TYPE" == "aab" ]; then
            echo "🚀 بدء بناء AAB..."
            gradle clean bundleRelease --no-daemon || gradle clean bundleDebug --no-daemon
            OUT_FILE=$(find . -path "*/build/outputs/bundle/*/*.aab" | head -n 1)
            FINAL_NAME="app-release-${BUILD_ID}.aab"
          else
            echo "🚀 بدء بناء APK..."
            gradle clean assembleDebug --no-daemon
            OUT_FILE=$(find . -path "*/build/outputs/apk/debug/*.apk" -o -name "*debug*.apk" | head -n 1)
            FINAL_NAME="app-debug-${BUILD_ID}.apk"
          fi

          if [ -z "$OUT_FILE" ]; then
            echo "❌ فشل العثور على الملف الناتج!"
            exit 1
          fi

          cp "$OUT_FILE" "$GITHUB_WORKSPACE/$FINAL_NAME"

      # 6. نشر الملف الناتج في قسم Releases
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.event.client_payload.build_id }}"
          name: "Build ${{ github.event.client_payload.build_id }}"
          files: "app-*-${{ github.event.client_payload.build_id }}.*"
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 7. تنظيف المجلد uploads وإزالة ملفات الـ ZIP بعد النجاح
      - name: Cleanup Uploads Directory
        if: always()
        run: |
          echo "🧹 جاري تنظيف مجلد uploads والحاويات المؤقتة..."
          rm -rf uploads/*
          rm -rf project_dir
          echo "✨ تم تنظيف المساحة بنجاح."
